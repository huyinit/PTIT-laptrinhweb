<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer</title>
  <!-- Link to the custom glassmorphism stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <h1>🎬 Movie Explorer</h1>
    <!-- Form for searching and filtering movies -->
    <form id="search-form">
      <input type="text" id="query" placeholder="Search movies..." required>
      <input type="number" id="year" placeholder="Year" min="1900" max="2030">
      <select id="type">
        <option value="">All Types</option>
        <option value="Scripted">Scripted</option>
        <option value="Reality">Reality</option>
        <option value="Animation">Animation</option>
      </select>
      <button>Search</button>
    </form>
    <!-- Movie list grid container -->
    <div id="results" class="grid"></div>
    <!-- Pagination controls -->
    <div class="pagination">
      <button id="prev" disabled>Prev</button>
      <span id="page-num">Page 1</span>
      <button id="next" disabled>Next</button>
    </div>
  </div>
  <!-- Application Entry Point module -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
